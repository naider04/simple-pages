<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CERTIFIED EXAM PREPARATION B1 — Simulador</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f5fb;
  --panel:#fff;
  --ink:#1a2133;
  --ink-soft:#39415a;
  --muted:#697391;
  --line:#e1e6f2;
  --line-strong:#cfd6e8;
  --brand:#4f46e5;
  --brand-strong:#4338ca;
  --brand-soft:#eef0ff;
  --ok:#0d7a4b;
  --ok-bg:#e9f8f0;
  --ok-line:#b6e5cd;
  --bad:#b3261e;
  --bad-bg:#fdecea;
  --bad-line:#f4c4c0;
  --warn:#8a6100;
  --warn-bg:#fff5da;
  --warn-line:#f1dca6;
  --shadow:0 20px 50px rgba(26,33,51,.09);
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:radial-gradient(1200px 620px at 12% -12%,#e4e9ff 0,rgba(228,233,255,0) 62%),var(--bg);
  color:var(--ink);
  min-height:100vh;
  line-height:1.55;
}
.app{width:100%;max-width:1200px;margin:0 auto;padding:22px 28px 80px}

/* ── top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 2px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#8b7bff);color:#fff;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:1rem;letter-spacing:-.01em}
.brand-text span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}

/* ── shared ── */
.screen{display:none}
.screen.active{display:block}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:1px solid transparent;border-radius:12px;background:var(--brand);color:#fff;font-size:.95rem;font-weight:650;font-family:inherit;cursor:pointer;transition:background .15s,box-shadow .15s,transform .05s}
.btn:hover{background:var(--brand-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:#fff;border-color:var(--line-strong);color:var(--ink-soft)}
.btn-ghost:hover{background:#f5f7fd;color:var(--ink)}
.btn-lg{padding:15px 40px;font-size:1.03rem;border-radius:14px;box-shadow:0 12px 26px rgba(79,70,229,.24)}

/* ── menu ── */
.hero{text-align:center;padding:20px 10px 38px}
.hero .eyebrow{display:inline-block;background:var(--brand-soft);color:var(--brand-strong);font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:6px 14px;border-radius:999px;margin-bottom:16px}
.hero h1{font-size:clamp(1.7rem,3.6vw,2.35rem);letter-spacing:-.025em;line-height:1.15;color:var(--ink)}
.hero p{color:var(--muted);margin-top:10px;font-size:1rem}

.menu-block{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px 30px;margin-bottom:22px}
.menu-block h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:16px;font-weight:700}
.menu-block h2 .step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);font-size:.72rem;font-weight:800}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cat-card{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border:1.5px solid var(--line);border-radius:16px;background:#fbfcff;text-align:left;font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.cat-card:hover{border-color:var(--line-strong);background:#fff;box-shadow:0 10px 24px rgba(26,33,51,.07)}
.cat-card.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 12px 26px rgba(79,70,229,.14)}
.cat-card .cat-name{font-size:1.02rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.cat-card .cat-desc{font-size:.82rem;color:var(--muted);line-height:1.4}
.cat-card .cat-count{margin-top:6px;font-size:.78rem;font-weight:700;color:var(--brand-strong)}
.cat-card .cat-tag{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.cat-card.active .cat-tag{background:var(--brand)}
.cat-card[data-key="all"] .cat-name{color:var(--brand-strong)}

.mode-row{display:flex;flex-wrap:wrap;gap:14px}
.mode-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex:1 1 240px;padding:16px 20px;border:1.5px solid var(--line);border-radius:16px;background:#fbfcff;font-family:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.mode-btn:hover{border-color:var(--line-strong);background:#fff}
.mode-btn.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 12px 26px rgba(79,70,229,.14)}
.mode-btn .mode-title{font-size:.98rem;font-weight:700;color:var(--ink)}
.mode-btn .mode-desc{font-size:.82rem;color:var(--muted)}

.start-row{display:flex;justify-content:center;padding:6px 0 2px}

/* ── practice ── */
.practice-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 34px 28px}
.sim-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sim-titles{min-width:0;flex:1 1 320px}
.sim-title{color:var(--ink);font-weight:800;font-size:1.14rem;letter-spacing:-.015em;overflow-wrap:break-word}
.sim-sub{color:var(--muted);font-size:.83rem;margin-top:3px}
.sim-header-right{display:flex;align-items:center;gap:10px}
.sim-score{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);padding:7px 14px;border-radius:999px;font-weight:750;font-size:.86rem;white-space:nowrap}
.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;background:#fff;border:1px solid var(--line-strong);color:var(--muted);font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--brand-strong);border-color:var(--brand)}

.progress-row{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.progress-track{flex:1;height:8px;border-radius:999px;background:#eceff8;overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--brand),#8b7bff);transition:width .25s ease}
.progress-label{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.sim-meta{color:var(--muted);font-size:.82rem;margin:14px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim-badge{display:inline-block;background:#f3f5fb;border:1px solid var(--line);color:var(--ink-soft);font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px}

.q{padding:0}
.q-num{font-weight:800;margin-bottom:6px;font-size:1rem;color:var(--ink)}
.q-num.correct{color:var(--ok)}
.q-num.wrong{color:var(--bad)}
.q-num.partial{color:var(--warn)}
.q-num.bank{color:var(--brand-strong)}
.q-type{color:#97a0b8;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.q-text{color:var(--ink-soft);margin-bottom:14px;font-size:1.04rem;line-height:1.75;white-space:pre-wrap;overflow-wrap:break-word}
.q-img{max-width:100%;border-radius:12px;margin:10px 0;border:1px solid var(--line)}
.opt-img{max-width:300px;border-radius:8px;margin:6px 0;display:block}

.opt{padding:6px 0 6px 30px;font-size:1rem;position:relative;color:var(--ink-soft)}
.opt::before{position:absolute;left:4px;top:6px;font-weight:800}
.opt.correct{color:var(--ok);font-weight:600}
.opt.correct::before{content:"✓";color:var(--ok)}
.opt.selected-wrong{color:var(--bad);text-decoration:line-through;opacity:.85}
.opt.selected-wrong::before{content:"✗";color:var(--bad)}
.opt.not-selected{color:var(--muted)}
.opt.not-selected::before{content:"•";color:#b7bfd4}
.opt.selected{color:var(--brand-strong);font-weight:600}
.opt.selected::before{content:"●";color:var(--brand)}

.feedback{color:var(--brand-strong);font-size:.9rem;margin-top:8px;padding:10px 14px;background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;font-style:italic;white-space:pre-wrap}
.essay-label{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;margin-top:12px;margin-bottom:5px;font-weight:700}
.essay-response{color:var(--ink-soft);font-size:.97rem;line-height:1.7;white-space:pre-wrap;background:#f8f9fd;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:4px}
.no-review{padding:15px 0;color:var(--muted);font-style:italic}
.stats{color:var(--muted);font-size:.85rem;text-align:right}

.q-audio{width:100%;max-width:620px;margin:12px 0 16px;display:block;border-radius:999px;background:#f3f5fb;padding:6px}

.sub-q{margin:14px 0;padding:14px 18px;background:#f8f9fd;border-radius:12px;border:1px solid var(--line)}
.sub-q-text{font-size:.98rem;color:var(--ink);margin-bottom:8px;font-weight:600}
.sub-opt{padding:3px 0 3px 22px;font-size:.95rem;position:relative;color:var(--ink-soft)}
.sub-opt::before{position:absolute;left:0;top:3px}
.sub-opt.correct{color:var(--ok);font-weight:600}
.sub-opt.correct::before{content:"✓";color:var(--ok)}
.sub-opt.selected-wrong{color:var(--bad);text-decoration:line-through;opacity:.85}
.sub-opt.selected-wrong::before{content:"✗";color:var(--bad)}
.sub-opt.not-selected{color:var(--muted)}
.sub-opt.not-selected::before{content:"•";color:#b7bfd4}
.sub-opt.selected{color:var(--brand-strong);font-weight:600}
.sub-opt.selected::before{content:"●";color:var(--brand)}
.sub-answer{font-size:.92rem;margin-top:6px;padding:5px 12px;border-radius:8px;display:inline-block;font-weight:600}
.sub-answer.correct{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.sub-answer.wrong{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.sub-answer.partial{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.ddwtos-answer{display:inline-block;margin:0 3px;padding:1px 8px;border-radius:6px;background:#f1f3fa;color:var(--ink-soft);font-weight:600;border:1px solid var(--line-strong);white-space:nowrap}
.q-text.ddwtos-ok .ddwtos-answer{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}

/* ── answer controls ── */
.sim-opt{display:block;width:100%;margin:9px 0;padding:14px 18px;text-align:left;background:#fbfcff;color:var(--ink-soft);border:1.5px solid var(--line);border-radius:13px;font-size:1rem;font-family:inherit;line-height:1.5;cursor:pointer;transition:border-color .13s,background .13s,box-shadow .13s}
.sim-opt:hover{border-color:#b9c0e0;background:#fff;box-shadow:0 6px 16px rgba(26,33,51,.05)}
.sim-opt.picked{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);box-shadow:0 8px 20px rgba(79,70,229,.14)}
.sim-opt strong{display:inline-block;min-width:22px;color:var(--brand-strong)}
.sim-gap{display:inline-block;margin:0 4px;padding:6px 10px;background:#fff;color:var(--ink);border:1.5px solid var(--line-strong);border-radius:9px;font-size:.95rem;font-family:inherit;max-width:100%}
.sim-essay{width:100%;min-height:140px;margin-top:10px;padding:14px 16px;background:#fbfcff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:1rem;line-height:1.6;resize:vertical}
.sim-essay:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.sim-hint{color:var(--muted);font-size:.86rem;margin:10px 0 4px}
.sim-choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.sim-chip{padding:6px 14px;background:#f3f5fb;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.86rem}

.sim-nav{display:flex;gap:12px;justify-content:space-between;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.sim-btn{display:inline-flex;align-items:center;justify-content:center;width:auto;padding:12px 22px;background:#fff;color:var(--ink-soft);border:1.5px solid var(--line-strong);border-radius:12px;font-size:.95rem;font-weight:650;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.sim-btn:hover:not(:disabled){background:#f5f7fd;border-color:#b9c0e0;color:var(--ink)}
.sim-btn:disabled{opacity:.4;cursor:default}
.sim-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 8px 20px rgba(79,70,229,.2)}
.sim-btn.primary:hover:not(:disabled){background:var(--brand-strong);border-color:var(--brand-strong)}
.sim-btn.ghost{background:transparent;color:var(--muted);border-color:transparent;font-size:1.05rem;padding:8px 10px}
.sim-btn.ghost:hover{color:var(--bad);background:var(--bad-bg)}

.sim-summary{margin-top:26px;padding:26px 24px;background:linear-gradient(180deg,#f7f8ff,#f2f4fd);border:1px solid var(--line);border-radius:18px;text-align:center}
.sim-summary-title{color:var(--ink);font-weight:800;font-size:1.15rem;margin-bottom:10px}
.sim-summary-stats{color:var(--ink-soft);font-size:.95rem;margin-bottom:8px}
.sim-summary-score{color:var(--brand-strong);font-weight:800;font-size:1.35rem;margin-bottom:18px}
.sim-summary-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sim-timer{background:#fff4e5;color:#b45309;border:1px solid #fcd9a8;padding:7px 14px;border-radius:999px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sim-timer.low{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.ai-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ai-overlay.open{display:flex}
.ai-card{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.25);width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;padding:20px}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ai-head h3{margin:0;font-size:1.1rem;color:var(--ink)}
.ai-x{border:none;background:#f1f3f9;color:var(--ink-soft);width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.ai-help{color:var(--muted);font-size:.88rem;margin:8px 0 12px}
.ai-text{flex:1;min-height:240px;width:100%;resize:vertical;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:.95rem;line-height:1.55;background:#fbfcff;color:var(--ink)}
.ai-text:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.ai-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

@media (max-width:760px){
  html{font-size:15px}
  .app{padding:16px 14px 60px}
  .menu-block{padding:20px 18px;border-radius:16px}
  .practice-card{padding:18px 16px 20px;border-radius:18px}
  .cat-grid{grid-template-columns:1fr 1fr}
  .sim-nav{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%);padding-bottom:6px}
  .sim-btn{flex:1;padding:12px 10px}
  .hero{padding:10px 4px 26px}
}
@media (max-width:460px){
  .cat-grid{grid-template-columns:1fr}
  .topbar{padding-bottom:14px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-logo">B1</span>
      <span class="brand-text">
        <strong>Simulador de examen</strong>
        <span>Certified Exam Preparation</span>
      </span>
    </div>
    <div class="topbar-actions">
      <button id="menu-back" class="btn btn-ghost hidden" type="button">← Volver al menú</button>
    </div>
  </div>

  <section id="menu-screen" class="screen active">
    <div class="hero">
      <span class="eyebrow">Banco de preguntas del curso</span>
      <h1>Practica para tu examen B1</h1>
      <p id="bank-summary"></p>
    </div>

    <div class="menu-block">
      <h2><span class="step">1</span>Elige el área</h2>
      <div class="cat-grid" id="cat-grid"></div>
    </div>

    <div class="menu-block">
      <h2><span class="step">2</span>Elige cuántas preguntas</h2>
      <div class="mode-row" id="mode-row">
        <button type="button" class="mode-btn active" data-mode="all">
          <span class="mode-title">Todo el banco</span>
          <span class="mode-desc" id="mode-all-desc">Todas las preguntas del área elegida</span>
        </button>
        <button type="button" class="mode-btn" data-mode="10">
          <span class="mode-title">Ronda de 10 al azar</span>
          <span class="mode-desc" id="mode-10-desc">10 preguntas mezcladas del área elegida</span>
        </button>
      </div>
    </div>

    <div class="start-row">
      <button id="start-btn" type="button" class="btn btn-lg">Empezar práctica</button>
    </div>
  </section>

  <section id="practice-screen" class="screen">
    <div class="practice-card">
      <div class="sim-header">
        <div class="sim-titles">
          <div class="sim-title" id="sim-title"></div>
          <div class="sim-sub" id="sim-sub"></div>
        </div>
        <div class="sim-header-right">
          <div class="sim-timer hidden" id="sim-timer">30:00</div>
          <div class="sim-score" id="sim-score">Puntos: 0 / 0</div>
          <button id="sim-reset" class="icon-btn" type="button" title="Reiniciar práctica">↻</button>
        </div>
      </div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label"></span>
      </div>
      <div id="sim-body"></div>
      <div class="sim-nav">
        <button id="sim-prev" class="sim-btn" type="button">← Anterior</button>
        <button id="sim-check" class="sim-btn primary" type="button">Comprobar</button>
        <button id="sim-next" class="sim-btn" type="button">Siguiente →</button>
      </div>
    </div>
  </section>
</div>

<div class="ai-overlay" id="ai-overlay" aria-hidden="true">
  <div class="ai-card" role="dialog" aria-modal="true" aria-labelledby="ai-title">
    <div class="ai-head">
      <h3 id="ai-title">Revisar con IA</h3>
      <button type="button" class="ai-x ai-close-btn" aria-label="Cerrar">×</button>
    </div>
    <p class="ai-help">Copia este texto (o selecciónalo) y pégalo en un chatbot para calificar tu ensayo.</p>
    <textarea id="ai-text" class="ai-text" readonly></textarea>
    <div class="ai-actions">
      <button type="button" class="btn" id="ai-copy">Copiar al portapapeles</button>
      <button type="button" class="btn btn-ghost ai-close-btn">Cerrar</button>
    </div>
  </div>

ey terms rather than complete sentences. She also shared presentation slides before class, which allowed me to read about the topic in advance. After a few weeks, I was following much more confidently.\nMaking friends required a different solution. I spoke to people in class, but most students already had established groups. Instead of waiting for invitations, I joined the university photography club. The club met every Wednesday and explored a different part of the city. Because everyone was discussing the photographs, conversation had a natural subject, and I stopped worrying about making language mistakes.\nGroup assignments were sometimes confusing. In my home university, students usually divide the work immediately and communicate mainly through messages. My Portuguese classmates preferred meeting in person to discuss ideas before choosing individual tasks. At first, I thought they were delaying the project. Later, I realised that these conversations helped the group agree on a clear direction, and we completed the work without rushing at the end.\nBefore travelling, I had imagined that the best part would be visiting famous places. I enjoyed those trips, but ordinary routines became more important: buying bread from the same shop, recognising people on the bus and studying in a small cafe near my apartment. These repeated experiences made the city feel less like a destination and more like a temporary home.\nLiving abroad did not make every day exciting or easy. There were moments when I felt tired of explaining myself or wanted familiar food. However, I learned that feeling comfortable in a new country depends partly on your own actions. Studying the language helped, but joining activities, asking questions and accepting different ways of working mattered just as much.\nQuestions 1-5","subQuestions":[{"number":1,"questionText":"1. What worried Ella most before she arrived?","type":"multianswer","options":[{"letter":"a","text":"Finding suitable university acco before it arrives in a store. This journey begins with a tree called the cacao tree.\nCacao trees grow in warm, wet regions near the equator. Countries in Latin America, Africa, and Asia produce cacao. The tree produces large fruits called pods. Inside each pod, there are cacao beans covered with a soft white pulp. Farmers open the pods and remove the beans. At this point, the beans do not taste like the chocolate people know. They are bitter and need several steps before they become useful for chocolate production.\nThe first important step is fermentation. Farmers place the beans in boxes or under leaves for several days. During this time, natural changes happen inside the beans. Fermentation helps develop the flavor of chocolate. After that, the beans are dried under the sun. Drying is important because wet beans can become damaged during transportation.\nWhen the beans are dry, they are put into bags and sent to factories. In the factory, workers clean and roast the beans. Roasting uses heat to bring out deeper flavors. Then the outer shells are removed, and the inside part of the bean is broken into small pieces. These pieces are called nibs. The nibs are ground into a thick liquid called chocolate liquor. This liquid does not contain alcohol; it is simply a name used in chocolate making.\nDifferent ingredients are added depending on the type of chocolate. Dark chocolate usually contains more cacao and less sugar. Milk chocolate includes milk powder, sugar, and cacao. White chocolate does not contain the dark parts of cacao beans, but it contains cacao butter, which comes from the bean. After mixing, the chocolate is refined to make it smooth. Then it is heated and cooled carefully so it has the right texture and shine.\nChocolate production also raises important social questions. Many cacao farmers work very hard but receive low payments. Some organizations promote fair trade chocolate. Fair trade programs try to help farmers receive better prices and improve working conditions. When consumers choose fair trade products, they support a system that pays more attention to the people who produce the ingredients.\nEnvironmental issues are also important. Cacao trees need specific conditions to grow well. Climate change, plant diseases, and deforestation can affect cacao farms. Some farmers are learning methods that protect trees, soil, and water. For example, they may grow cacao under the shade of taller trees instead of cutting all trees in an area.\nThe next time someone eats a piece of chocolate, they may think about more than its taste. Chocolate connects farmers, climates, transportation, factories, stores, and consumers. Behind a simple dessert, there is a complex process and the work of many people.\nChoose the best answer for each question.","subQuestions":[{"number":1,"questionText":"1. What is the passage mainly about?","type":"multianswer","options":[{"letter":"a","text":"The process and issues involved in producing chocolate.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"The best recipes for making chocolate desserts at home.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"The reasons people should stop eating chocolate.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"The history of supermarkets that sell chocolate.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":2,"questionText":"2. Where do cacao trees usually grow?","type":"multianswer","options":[{"letter":"a","text":"In warm, wet regions near the equator.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"In cold mountains far from the equator.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Only in large cities with factories.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"In dry deserts with little water.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":3,"questionText":"3. Why is fermentation important?","type":"multianswer","options":[{"letter":"a","text":"It helps develop the flavor of chocolate.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"It makes the beans white and sweet immediately.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"It removes all sugar from the beans.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"It packages chocolate for transportation.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":4,"questionText":"4. What is fair trade chocolate connected to?","type":"multianswer","options":[{"letter":"a","text":"Better prices and working conditions for farmers.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"More expensive machines in every store.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"A type of chocolate with no cacao.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"A rule that farmers cannot sell beans.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":5,"questionText":"5. What can be inferred from the passage?","type":"multianswer","options":[{"letter":"a","text":"Chocolate production depends on both natural conditions and human work.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Chocolate is produced in one simple step.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"All cacao farmers receive high payments.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"White chocolate contains the dark parts of cacao beans.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false}],"options":[],"selectedValue":-1,"markObtained":0,"markMax":1,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":5,"timesCorrect":3,"timesWrong":2,"timesPartial":0,"avgMarkPct":60},"sourceQuiz":"Simulador Reading"},{"questionBank":true,"questionNumber":132,"type":"multianswer","questionText":"Online Learning and Study Habits\nOnline learning has changed the way many students study. In the past, most students had to go to a classroom at a fixed time. They listened to the teacher, took notes, and completed activities with their classmates. Today, many courses are partly or completely online. Students can watch videos, read materials, send assignments, and communicate with teachers through digital platforms.\nOnline learning offers several advantages. One important benefit is flexibility. A student who works during the day can study at night. Another student who lives far from the university can join a class without traveling for hours. Online learning can also help students review information. If a lesson is recorded, students can watch it again when they do not understand something the first time.\nHowever, online learning requires strong study habits. In a physical classroom, the teacher and classmates help create a routine. At home, there may be many distractions, such as family conversations, television, social media, or household responsibilities. Students need to plan their time carefully. They should decide when to study, where to study, and how long each session will be.\nA good study space is important. It does not need to be large or expensive, but it should be clean, quiet, and comfortable. Students should keep their materials near them: notebooks, pens, textbooks, headphones, and a stable internet connection if possible. When students prepare their space before class, they waste less time looking for things.\nAnother useful habit is taking notes. Some students think that online videos are enough because they can watch them again. However, writing notes helps the brain organize information. Notes do not need to include every word from the teacher. They should include main ideas, examples, important dates, and questions to ask later. Students can also use colors or diagrams to make their notes easier to understand.\nParticipation is also important in online learning. Some students feel shy because they do not want to speak through a microphone. Others turn off the camera and become passive. But participation can take different forms. Students can write in the chat, answer polls, work in small groups, or send questions after class. Active students usually remember more because they use the information, not only receive it.\nTeachers also have responsibilities. They need to give clear instructions, organize materials, and provide feedback. A long list of files without explanation can confuse students. Short videos, examples, discussion questions, and weekly reminders can make online learning easier.\nIn the end, online learning is not easier or harder than traditional learning. It is different. Students who develop good habits can succeed in online courses. They learn not only the subject of the class but also important skills such as independence, organization, and digital communication.\nChoose the best answer for each question.","subQuestions":[{"number":1,"questionText":"1. What is the main purpose of the passage?","type":"multianswer","options":[{"letter":"a","text":"To explain benefits and study habits related to online learning.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"To show that online learning should disappear.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"To describe the history of universities around the world.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"To compare television programs and online videos.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":2,"questionText":"2. Why is flexibility an advantage of online learning?","type":"multianswer","options":[{"letter":"a","text":"Students can study at times that fit their personal situations.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Students never need to complete assignments.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Teachers do not have to prepare lessons.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"All students study less than before.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":3,"questionText":"3. According to the passage, why is taking notes useful?","type":"multianswer","options":[{"letter":"a","text":"It helps students organize information in their brains.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"It allows students to avoid watching videos.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"It replaces all communication with teachers.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"It makes internet connections more stable.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":4,"questionText":"4. Which action is an example of participation in an online class?","type":"multianswer","options":[{"letter":"a","text":"Writing a question in the chat.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Turning off all notifications after class.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Watching television during the lesson.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Leaving the computer without telling anyone.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":5,"questionText":"5. What can be inferred from the passage?","type":"multianswer","options":[{"letter":"a","text":"Successful online students need discipline and organization.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Online students do not need teachers.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Recorded lessons are always better than live classes.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Physical classrooms have no distractions.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false}],"options":[],"selectedValue":-1,"markObtained":0,"markMax":1,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":5,"timesCorrect":4,"timesWrong":1,"timesPartial":0,"avgMarkPct":80},"sourceQuiz":"Simulador Reading"},{"questionBank":true,"questionNumber":133,"type":"multianswer","questionText":"Urban Gardens\nIn many large cities, people live in apartments and do not have private gardens. Streets are busy, buildings are tall, and green spaces are sometimes far away. For this reason, urban gardens have become popular in different parts of the world. An urban garden is a small area in a city where people grow vegetables, fruits, herbs, or flowers. These gardens can be found on empty land, on rooftops, next to schools, or even beside apartment buildings.\nUrban gardens are not new, but they are becoming more important. In the past, people used them mainly to produce food during difficult times. Today, they have many purposes. First, they help people eat fresh food. A family that grows tomatoes, lettuce, or onions can use these products at home and spend less money at the market. The food is also fresh because it does not travel many kilometers before it reaches the kitchen.\nSecond, urban gardens help people learn about nature. Many children in cities know that food comes from supermarkets, but they may not understand how plants grow. When students plant seeds, water them, and watch them change, they learn patience and responsibility. They also understand that food production requires time, care, and good conditions.\nUrban gardens can also improve community life. In some neighborhoods, people do not know their neighbors well. A shared garden gives them a reason to meet, talk, and work together. Older people may teach younger people how to plant vegetables. New residents may feel more welcome when they join a garden group. In this way, the garden becomes more than a place for plants. It becomes a place for communication and cooperation.\nThere are environmental benefits, too. Plants can help reduce heat in cities, especially during very hot months. They also provide small habitats for birds and insects. Some gardens collect rainwater and use organic waste to make compost. These practices help people reduce waste and use resources more carefully.\nHowever, urban gardens also have challenges. The land may not belong to the people who use it, so the garden can disappear if the owner decides to build something there. Some places may have soil that is not clean enough for food production. In these cases, gardeners need to use raised boxes with clean soil. Another problem is time. A garden needs regular care, and not everyone can visit it every day.\nEven with these challenges, many cities now support urban gardening projects. Schools, community centers, and local governments see gardens as useful educational and social spaces. Urban gardens cannot solve all problems in a city, but they can make daily life healthier, greener, and more connected.\nChoose the best answer for each question.","subQuestions":[{"number":1,"questionText":"1. What is the main idea of the passage?","type":"multianswer","options":[{"letter":"a","text":"Urban gardens can provide food, education, community, and environmental benefits.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Urban gardens are only useful for families who own houses.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Urban gardens are replacing supermarkets in most large cities.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Urban gardens are too difficult to maintain in modern cities.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":2,"questionText":"2. According to the passage, how can urban gardens help children?","type":"multianswer","options":[{"letter":"a","text":"They teach children how plants grow and how to be responsible.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"They help children avoid going to school.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"They show children how to build apartment buildings.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"They make children spend more money at the market.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":3,"questionText":"3. Why can urban gardens improve community life?","type":"multianswer","options":[{"letter":"a","text":"They give neighbors a place to meet and work together.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"They make people stop using public transportation.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"They allow only young people to participate.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"They remove all buildings from a neighborhood.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":4,"questionText":"4. What problem is mentioned in the passage?","type":"multianswer","options":[{"letter":"a","text":"The land used for a garden may not always be available.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Urban gardens always produce too much food.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Cities do not allow flowers in public spaces.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Children are not interested in watching plants grow.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":5,"questionText":"5. What does the word 'habitats' mean in the passage?","type":"multianswer","options":[{"letter":"a","text":"Places where animals or insects can live.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Machines used to clean the soil.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Rules that gardeners must follow.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Tall buildings in busy cities.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false}],"options":[],"selectedValue":-1,"markObtained":0,"markMax":1,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":6,"timesCorrect":4,"timesWrong":2,"timesPartial":0,"avgMarkPct":66.7},"sourceQuiz":"Simulador Reading"},{"questionBank":true,"questionNumber":134,"type":"multianswer","questionText":"Sleep and Student Performance\nMany students believe that studying late at night is the best way to prepare for an exam. They may drink coffee, read their notes for hours, and sleep very little. The next day, they feel proud because they studied a lot. However, research on learning and health shows that sleep is not a waste of time. It is an important part of successful studying.\nSleep helps the brain organize information. During the day, students receive many details from classes, books, conversations, and online materials. At night, the brain works with this information and connects it to things the student already knows. This process helps memory. A student who sleeps well after studying may remember information better than a student who studies all night and sleeps only two hours.\nSleep also affects attention. In class, students need to listen, read, write, and solve problems. When they do not sleep enough, these tasks become harder. They may read the same paragraph many times without understanding it. They may make simple mistakes in math or forget instructions from the teacher. Lack of sleep can also make students feel impatient or anxious.\nGood sleep does not mean sleeping for twelve hours every day. Most teenagers and young adults need a regular routine and enough hours to feel rested. The exact number of hours can vary, but the quality of sleep is also important. A student who sleeps eight hours but wakes up many times may not feel well in the morning. Noise, bright lights, stress, and using a phone in bed can reduce sleep quality.\nPhones are a common problem. Many students check messages or watch videos before sleeping. This habit can delay sleep because the brain stays active. The light from screens may also make it harder for the body to feel ready for rest. For this reason, some experts recommend turning off screens at least thirty minutes before bedtime. Students can read a printed book, prepare their bag for the next day, or listen to calm music instead.\nPlanning study time can improve sleep. If students begin preparing several days before an exam, they do not need to study everything the night before. Short study sessions with breaks are often more effective than one very long session. A weekly schedule can help students balance homework, family responsibilities, exercise, and rest.\nTeachers and families can support healthy sleep habits, too. Teachers can avoid giving too many assignments with the same deadline, and families can help create a quiet environment at night. Students should also learn to recognize when tiredness is affecting their learning. Feeling sleepy every morning is not normal and may be a sign that they need to change their routine.\nIn conclusion, sleep is part of learning. It supports memory, attention, mood, and health. Students who want to perform well should not only ask, “How many hours did I study?” They should also ask, “Did I give my brain enough rest?”\nChoose the best answer for each question.","subQuestions":[{"number":1,"questionText":"1. What is the main idea of the passage?","type":"multianswer","options":[{"letter":"a","text":"Sleep is important for students' learning, memory, and performance.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Students should study all night before every exam.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Coffee is the best solution for tired students.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Students need twelve hours of sleep every night.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":2,"questionText":"2. According to the passage, what does the brain do during sleep?","type":"multianswer","options":[{"letter":"a","text":"It organizes information and connects it to previous knowledge.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"It stops working completely until morning.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"It forgets most of the information from the day.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"It learns only mathematical information.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":3,"questionText":"3. Why can phones make sleep more difficult?","type":"multianswer","options":[{"letter":"a","text":"They can keep the brain active and delay rest.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"They always make students sleep too early.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"They remove all stress from the body.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"They improve sleep quality when used in bed.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":4,"questionText":"4. What study habit does the passage recommend?","type":"multianswer","options":[{"letter":"a","text":"Preparing several days before an exam.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Studying everything in one very long night.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Avoiding all breaks during study sessions.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Doing homework only after midnight.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":5,"questionText":"5. What does the phrase 'quality of sleep' refer to?","type":"multianswer","options":[{"letter":"a","text":"How well a person sleeps, not only how many hours.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"The number of books a student reads at night.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"The exact hour a teacher gives homework.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"The amount of coffee a student drinks.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false}],"options":[],"selectedValue":-1,"markObtained":0,"markMax":1,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":5,"timesCorrect":3,"timesWrong":2,"timesPartial":0,"avgMarkPct":60},"sourceQuiz":"Simulador Reading"},{"questionBank":true,"questionNumber":135,"type":"multianswer","questionText":"The Value of Public Libraries\nPublic libraries are common in many towns and cities, but people sometimes misunderstand their purpose. Some people think libraries are only quiet buildings with shelves of old books. Others believe that libraries are less necessary today because information is available on the internet. In reality, public libraries continue to play an important role in education, culture, and community life.\nA public library gives people access to books, newspapers, magazines, and digital materials. This access is important because not everyone can buy books or pay for online resources. A student who needs information for a school project can visit the library and use reliable materials. A person who wants to learn a new skill can borrow books or use free online courses offered by the library. In this way, libraries support learning at every age.\nLibraries also help people develop reading habits. Children who visit libraries often can choose books that match their interests. They may read stories about animals, science, sports, or adventures. When children choose their own books, reading can become enjoyable instead of only a school task. Many libraries organize story hours, reading clubs, and summer programs to motivate young readers.\nAnother important service is digital access. Although many people use the internet every day, not everyone has a computer or a stable connection at home. Public libraries often provide computers, Wi-Fi, and basic technology support. A person may use a library computer to write a resume, send an application, attend an online interview, or complete an official form. For people looking for work, this support can be very valuable.\nLibraries are also safe public spaces. People can study, read, work, or attend community events without needing to buy anything. This is different from cafes or private study centers, where people usually have to pay. In a library, students can prepare for exams, older adults can read newspapers, and community groups can meet for educational activities.\nModern libraries are changing. Many now offer workshops, language classes, exhibitions, film discussions, and activities for families. Some libraries have makerspaces where people can learn about technology, design, or crafts. Others lend objects such as musical instruments, educational games, or tools. These services show that libraries are not only about books. They are about access to knowledge and opportunities.\nOf course, libraries face challenges. They need money to buy new materials, maintain buildings, and pay trained staff. They also need to adapt to new technology. If a library does not update its services, people may stop visiting. For this reason, many libraries listen to their communities and create programs that answer local needs.\nPublic libraries remain important because they reduce inequality. They give people free or low-cost access to information, technology, culture, and a place to learn. Even in a digital world, libraries continue to help people grow.\nChoose the best answer for each question.","subQuestions":[{"number":1,"questionText":"1. What is the main idea of the passage?","type":"multianswer","options":[{"letter":"a","text":"Public libraries still provide important services in modern communities.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Public libraries are only useful for storing old books.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"Public libraries should become private businesses.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Public libraries are less reliable than internet websites.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":2,"questionText":"2. Why is access to library materials important?","type":"multianswer","options":[{"letter":"a","text":"Not everyone can buy books or pay for online resources.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"Libraries only have materials for university teachers.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"People can use libraries only if they have a computer at home.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"Books in libraries are always more expensive than books in stores.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":3,"questionText":"3. According to the passage, how do libraries help people looking for work?","type":"multianswer","options":[{"letter":"a","text":"They provide computers and internet access for resumes and applications.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"They guarantee that every visitor will get a job.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"They lend professional clothes to all users.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"They replace interviews with reading clubs.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":4,"questionText":"4. What does the passage say about modern libraries?","type":"multianswer","options":[{"letter":"a","text":"They may offer workshops, classes, exhibitions, and technology spaces.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"They no longer allow children to enter.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"They have stopped using digital materials.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"They only open during school vacations.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false},{"number":5,"questionText":"5. What does the word 'inequality' mean in the final paragraph?","type":"multianswer","options":[{"letter":"a","text":"A situation where people do not have the same opportunities.","optionImages":[],"selected":false,"markedCorrect":true,"markedIncorrect":false,"index":0},{"letter":"b","text":"A type of library card for students.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":1},{"letter":"c","text":"A program for reading fiction books.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":2},{"letter":"d","text":"A place where people buy digital devices.","optionImages":[],"selected":false,"markedCorrect":false,"markedIncorrect":false,"index":3}],"selectedText":"","isCorrect":false,"isIncorrect":false}],"options":[],"selectedValue":-1,"markObtained":0,"markMax":1,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":5,"timesCorrect":2,"timesWrong":3,"timesPartial":0,"avgMarkPct":40},"sourceQuiz":"Simulador Reading"},{"questionBank":true,"questionNumber":136,"type":"essay","questionText":"B1 Writing Task: Opinion Essay\nTopic: Homework and Learning\nStatement: Some people think that students should not have homework because they already study many hours at school or university.\nQuestion: Do you agree or disagree with this statement?\nTask: Write a 4-paragraph opinion essay . You must clearly state your opinion and support it with reasons and examples.\nYour essay must include:\n1. Paragraph 1 - Introduction: Write a hook to introduce the topic and a clear thesis statement that shows if you agree or disagree.\n2. Paragraph 2 - Body paragraph 1: Give your first main reason and support it with an explanation or example.\n3. Paragraph 3 - Body paragraph 2: Give your second main reason and support it with an explanation or example.\n4. Paragraph 4 - Conclusion: Restate your opinion and summarize your main ideas.\nSuggested length: 140-180 words.\nImportant: Use connectors such as first, also, however, for example, in my opinion, because, therefore, in conclusion . Write complete sentences and organize your ideas clearly.","subQuestions":[],"options":[],"selectedValue":-1,"markObtained":0,"markMax":1,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":1,"timesCorrect":0,"timesWrong":0,"timesPartial":1,"avgMarkPct":0},"sourceQuiz":"Simulador Writing"},{"questionBank":true,"questionNumber":137,"type":"essay","questionText":"Writing Question 9: Studying Abroad\nStatement: A person must study in an English-speaking country to become a good English teacher.\nTask: Do you agree or disagree with this statement? Explain your opinion.\nInstructions: Write an opinion essay of no more than 350 words. Do you agree or disagree with the statement? You must state your clear opinion in the introduction, including a hook and a thesis statement with two supporting reasons. Give the two supporting reasons in separate body paragraphs, and summarize your views in a short conclusion.","subQuestions":[],"options":[],"selectedValue":-1,"markObtained":0,"markMax":25,"isCorrect":false,"isWrong":false,"images":[],"audios":[],"feedbackImages":[],"essayResponse":"","feedback":"","stats":{"seenInAttempts":1,"timesCorrect":0,"timesWrong":0,"timesPartial":1,"avgMarkPct":0},"sourceQuiz":"WRITING EXAM"}]};
