// Local media lives next to this page (resources/…); remote URLs are kept as a
// fallback for anything that was not downloaded.
function res(local, remote) {
  return local ? 'resources/' + encodeURIComponent(local) : remote;
}

// Appends plain text and <img> elements to container. \u0002url\u0002 markers
// become images (feedback text uses this).
function appendRichText(container, text, imgMap, imgClass, alt) {
  const parts = String(text || '').split(IMG_T);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const url = parts[i];
      if (!url) continue;
      const local = imgMap ? imgMap.get(url) : null;
      const el = document.createElement('img');
      el.className = imgClass;
      el.alt = alt;
      el.loading = 'lazy';
      el.src = res(local, url);
      container.appendChild(el);
    } else if (parts[i]) {
      container.appendChild(document.createTextNode(parts[i]));
    }
  }
}

// Reveal phase: renders a reviewed question with correct answers marked.
function renderQuestion(q) {
  const div = document.createElement('div');
  div.className = 'q';

  const num = document.createElement('div');
  num.className = 'q-num ' + (q.isCorrect ? 'correct' : q.isWrong ? 'wrong' : 'partial');
  num.textContent = q.isCorrect
    ? `P${q.questionNumber} — ✓ Correcta`
    : q.isWrong
      ? `P${q.questionNumber} — ✗ Incorrecta`
      : `P${q.questionNumber} — ${q.markObtained}/${q.markMax}`;
  div.appendChild(num);

  const type = document.createElement('div');
  type.className = 'q-type';
  type.textContent = q.type;
  div.appendChild(type);

  const text = document.createElement('div');
  text.className = (q.type === 'ddwtos' || q.type === 'gapselect') && q.isCorrect ? 'q-text ddwtos-ok' : 'q-text';
  let processedText = q.questionText;
  if (q.type === 'ddwtos' && q.subQuestions && q.subQuestions.length) {
    q.subQuestions.forEach((sub, index) => {
      const placeholderRegex = new RegExp(`(<span class="place${index + 1}">)[^<]*(</span>)`, 'g');
      processedText = processedText.replace(placeholderRegex, `$1${sub.selectedText || ''}$2`);
    });
  }
  const imgMap = new Map((q.images || []).map((i) => [i.url, i.localFile]));
  const renderedInText = new Set();
  processedText = processedText.replace(IMG_TOKEN_RE, (m, url) => {
    renderedInText.add(url);
    const local = imgMap.get(url);
    const src = res(local, url);
    return `<img class="q-img" alt="question image" loading="lazy" src="${src.replace(/"/g, '&quot;')}">`;
  });
  text.innerHTML = processedText;
  div.appendChild(text);

  const feedbackImgUrls = new Set((q.feedbackImages || []).map((i) => i.url));
  for (const img of q.images || []) {
    if (renderedInText.has(img.url) || feedbackImgUrls.has(img.url)) continue;
    const el = document.createElement('img');
    el.className = 'q-img';
    el.alt = 'question image';
    el.loading = 'lazy';
    el.src = res(img.localFile, img.url);
    div.appendChild(el);
  }

  for (const a of (q.audios || [])) {
    const el = document.createElement('audio');
    el.className = 'q-audio';
    el.controls = true;
    el.preload = 'none';
    el.src = res(a.localFile, a.url);
    div.appendChild(el);
  }

  if (q.type !== 'ddwtos') {
    for (const sub of (q.subQuestions || [])) {
      const subDiv = document.createElement('div');
      subDiv.className = 'sub-q';

      if (sub.questionText) {
        const stemEl = document.createElement('div');
        stemEl.className = 'sub-q-text';
        stemEl.textContent = sub.questionText;
        subDiv.appendChild(stemEl);
      }

      if (sub.type === 'select') {
        const cls = sub.isCorrect ? 'correct' : sub.isIncorrect ? 'wrong' : q.isCorrect ? 'correct' : q.isWrong ? 'wrong' : 'partial';
        const ansEl = document.createElement('div');
        ansEl.className = 'sub-answer ' + cls;
        ansEl.textContent = sub.selectedText || '— (sin selección)';
        subDiv.appendChild(ansEl);
      } else if (sub.options && sub.options.length > 0) {
        for (const opt of sub.options) {
          let cls = 'not-selected';
          if (opt.markedCorrect) cls = 'correct';
          else if (opt.markedIncorrect && opt.selected) cls = 'selected-wrong';
          else if (sub.isCorrect && opt.selected) cls = 'correct';
          else if (sub.isIncorrect && opt.selected) cls = 'selected-wrong';
          else if (!sub.isCorrect && !sub.isIncorrect && opt.selected) cls = 'selected';
          const optEl = document.createElement('div');
          optEl.className = 'sub-opt ' + cls;
          const strong = document.createElement('strong');
          strong.textContent = opt.letter;
          optEl.appendChild(strong);
          if (opt.text) optEl.appendChild(document.createTextNode(' ' + opt.text));
          subDiv.appendChild(optEl);
        }
      } else if (sub.selectedText) {
        const ansEl = document.createElement('div');
        ansEl.className = 'sub-answer ' + (sub.isCorrect ? 'correct' : sub.isIncorrect ? 'wrong' : 'partial');
        ansEl.textContent = sub.selectedText;
        subDiv.appendChild(ansEl);
      }

      div.appendChild(subDiv);
    }
  }

  const isPartial = !q.isCorrect && !q.isWrong;
  for (const opt of q.options || []) {
    let cls = 'not-selected';
    if (opt.markedCorrect) cls = 'correct';
    else if (opt.markedIncorrect && opt.selected) cls = 'selected-wrong';
    else if (q.isCorrect && opt.selected) cls = 'correct';
    else if (q.isWrong && opt.selected) cls = 'selected-wrong';
    else if (isPartial && opt.selected) cls = 'selected';
    const el = document.createElement('div');
    el.className = 'opt ' + cls;
    const strong = document.createElement('strong');
    strong.textContent = opt.letter;
    el.appendChild(strong);
    if (opt.text) el.appendChild(document.createTextNode(' ' + opt.text));
    for (const img of (opt.optionImages || [])) {
      el.appendChild(document.createElement('br'));
      const imgEl = document.createElement('img');
      imgEl.className = 'opt-img';
      imgEl.alt = 'option image';
      imgEl.src = res(img.localFile, img.url);
      el.appendChild(imgEl);
    }
    div.appendChild(el);
  }

  if (q.essayResponse) {
    const lbl = document.createElement('div');
    lbl.className = 'essay-label';
    lbl.textContent = 'Tu respuesta:';
    div.appendChild(lbl);
    const resp = document.createElement('div');
    resp.className = 'essay-response';
    resp.textContent = q.essayResponse;
    div.appendChild(resp);
  }

  if (q.feedback) {
    const fb = document.createElement('div');
    fb.className = 'feedback';
    appendRichText(fb, q.feedback, new Map((q.feedbackImages || []).map((i) => [i.url, i.localFile])), 'q-img', 'feedback image');
    div.appendChild(fb);
  }

  return div;
}

// ─── Simulator ────────────────────────────────────────────────────────
// ─── Simulator ────────────────────────────────────────────────────────
const SKILLS = [
  { key: 'all', label: 'Todas las áreas', desc: 'Practica con el banco completo del curso', test: () => true },
  { key: 'grammar', label: 'Grammar', desc: 'Gramática: tiempos verbales, condicionales, preposiciones…', test: (q) => /grammar/i.test(q.sourceQuiz || '') },
  { key: 'listening', label: 'Listening', desc: 'Comprensión auditiva: escucha el audio y responde', test: (q) => /listening/i.test(q.sourceQuiz || '') },
  { key: 'reading', label: 'Reading', desc: 'Comprensión lectora: lee el texto y responde', test: (q) => /reading/i.test(q.sourceQuiz || '') },
  { key: 'writing', label: 'Writing', desc: 'Expresión escrita: redacta tu respuesta', test: (q) => /writing/i.test(q.sourceQuiz || '') },
];

const menuState = { skill: 'all', mode: 'all' };

const $menuScreen = document.getElementById('menu-screen');
const $practiceScreen = document.getElementById('practice-screen');
const $catGrid = document.getElementById('cat-grid');
const $startBtn = document.getElementById('start-btn');
const $menuBack = document.getElementById('menu-back');
const $progressFill = document.getElementById('progress-fill');
const $progressLabel = document.getElementById('progress-label');
const $simTimer = document.getElementById('sim-timer');
const $aiOverlay = document.getElementById('ai-overlay');
const $aiText = document.getElementById('ai-text');
let simTimerId = null;

function stopAudio() {
  document.querySelectorAll('#sim-body audio').forEach((el) => {
    try {
      el.pause();
      el.currentTime = 0;
    } catch (e) {}
  });
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function stopTimer() {
  if (simTimerId) {
    clearInterval(simTimerId);
    simTimerId = null;
  }
  if ($simTimer) {
    $simTimer.classList.add('hidden');
    $simTimer.classList.remove('low');
  }
}

function startTimer(seconds) {
  if (!$simTimer) return;
  if (simTimerId) clearInterval(simTimerId);
  let left = seconds;
  $simTimer.classList.remove('hidden', 'low');
  $simTimer.textContent = fmtTime(left);
  simTimerId = setInterval(() => {
    left -= 1;
    if (left <= 300) $simTimer.classList.add('low');
    if (left <= 0) {
      stopTimer();
      $simTimer.classList.remove('hidden');
      $simTimer.classList.add('low');
      $simTimer.textContent = '00:00';
      return;
    }
    $simTimer.textContent = fmtTime(left);
  }, 1000);
}

function syncTimer() {
  if (simState && simState.skill === 'writing') startTimer(30 * 60);
  else stopTimer();
}

function plainText(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = String(html || '');
  return tmp.textContent.replace(/\s+/g, ' ').trim();
}

function buildAiPrompt(q, answer) {
  return [
    'Revisa este ensayo que escribí para un examen b1 de ingles, cuánto me calificarías sobre 25?',
    '',
    'Tarea: ' + plainText(q.questionText),
    '',
    'Ensayo del estudiante:',
    (answer || '').trim() || '(vacío)',
  ].join('\n');
}

function practiceComplete() {
  return simState.questions.every((q, i) => {
    const a = simState.answers[i];
    if (a.checked) return true;
    if (q.type === 'essay') return a.aiUsed || String(a.picked[0] || '').trim() !== '';
    return false;
  });
}

function openAiPrompt(text) {
  if (!$aiOverlay || !$aiText) return;
  $aiText.value = text;
  $aiOverlay.classList.add('open');
  $aiOverlay.setAttribute('aria-hidden', 'false');
  $aiText.focus();
  $aiText.select();
}

function closeAiPrompt() {
  if (!$aiOverlay) return;
  $aiOverlay.classList.remove('open');
  $aiOverlay.setAttribute('aria-hidden', 'true');
}

if ($aiOverlay) {
  $aiOverlay.addEventListener('click', (e) => {
    if (e.target === $aiOverlay) closeAiPrompt();
  });
  document.querySelectorAll('.ai-close-btn').forEach((b) => b.addEventListener('click', closeAiPrompt));
  document.getElementById('ai-copy').addEventListener('click', () => {
    const btn = document.getElementById('ai-copy');
    const done = () => {
      btn.textContent = '¡Copiado!';
      setTimeout(() => {
        btn.textContent = 'Copiar al portapapeles';
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText($aiText.value).then(done).catch(() => {
        $aiText.select();
        document.execCommand('copy');
        done();
      });
    } else {
      $aiText.select();
      document.execCommand('copy');
      done();
    }
  });
}

function skillQuestions(skillKey) {
  const skill = SKILLS.find((s) => s.key === skillKey) || SKILLS[0];
  return DATA.questions.filter(skill.test);
}

function shuffle(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = out[i];
    out[i] = out[j];
    out[j] = tmp;
  }
  return out;
}

function poolFor(skillKey, mode) {
  const pool = skillQuestions(skillKey);
  return mode === '10' ? shuffle(pool).slice(0, 10) : pool;
}

function buildMenu() {
  $catGrid.innerHTML = '';
  for (const skill of SKILLS) {
    const count = skill.key === 'all' ? DATA.questions.length : skillQuestions(skill.key).length;
    if (!count) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-card' + (menuState.skill === skill.key ? ' active' : '');
    btn.dataset.key = skill.key;
    const tag = document.createElement('span');
    tag.className = 'cat-tag';
    const name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = skill.label;
    const desc = document.createElement('span');
    desc.className = 'cat-desc';
    desc.textContent = skill.desc;
    const cnt = document.createElement('span');
    cnt.className = 'cat-count';
    cnt.textContent = count + (count === 1 ? ' pregunta' : ' preguntas');
    btn.append(tag, name, desc, cnt);
    btn.addEventListener('click', () => {
      menuState.skill = skill.key;
      buildMenu();
      updateStart();
    });
    $catGrid.appendChild(btn);
  }
}

function updateStart() {
  const available = skillQuestions(menuState.skill).length;
  const n = menuState.mode === '10' ? Math.min(10, available) : available;
  $startBtn.textContent = n
    ? `Empezar práctica · ${n} pregunta${n === 1 ? '' : 's'}`
    : 'Sin preguntas disponibles';
  $startBtn.disabled = !n;
  document.querySelectorAll('#mode-row .mode-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.mode === menuState.mode);
  });
  const skill = SKILLS.find((s) => s.key === menuState.skill);
  const allDesc = document.getElementById('mode-all-desc');
  const tenDesc = document.getElementById('mode-10-desc');
  if (allDesc) allDesc.textContent = `${skill.label}: ${available} pregunta${available === 1 ? '' : 's'}`;
  if (tenDesc) {
    tenDesc.textContent = available > 10
      ? `10 preguntas mezcladas de ${skill.label}`
      : available
        ? `Solo hay ${available}; se usarán todas`
        : 'Sin preguntas en esta área';
  }
}

function showScreen(name) {
  if (name !== 'practice') {
    stopAudio();
    stopTimer();
  }
  $menuScreen.classList.toggle('active', name === 'menu');
  $practiceScreen.classList.toggle('active', name === 'practice');
  $menuBack.classList.toggle('hidden', name !== 'practice');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function startPractice(questions, opts) {
  const options = opts || {};
  simState = {
    questions,
    index: 0,
    answers: questions.map(() => ({ picked: [], checked: false, markObtained: 0, markMax: 0 })),
    label: options.label || 'Práctica',
    mode: options.mode || 'all',
    skill: options.skill || 'all',
  };
  $simTitle.textContent = simState.label;
  $simSub.textContent =
    `${questions.length} pregunta${questions.length === 1 ? '' : 's'} · ` +
    (simState.mode === '10' ? 'ronda aleatoria' : 'banco completo');
  showScreen('practice');
  syncTimer();
  renderSimQuestion();
}

document.querySelectorAll('#mode-row .mode-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    menuState.mode = btn.dataset.mode;
    updateStart();
  });
});

$startBtn.addEventListener('click', () => {
  const questions = poolFor(menuState.skill, menuState.mode);
  if (!questions.length) return;
  const skill = SKILLS.find((s) => s.key === menuState.skill);
  startPractice(questions, {
    label: skill.key === 'all' ? 'Todas las áreas' : skill.label,
    mode: menuState.mode,
    skill: menuState.skill,
  });
});

$menuBack.addEventListener('click', () => showScreen('menu'));

$simReset.addEventListener('click', () => {
  if (!simState) return;
  simState.answers = simState.questions.map(() => ({ picked: [], checked: false, markObtained: 0, markMax: 0 }));
  simState.index = 0;
  renderSimQuestion();
  syncTimer();
  window.scrollTo({ top: 0, behavior: 'auto' });
});

$simPrev.addEventListener('click', () => {
  if (simState && simState.index > 0) {
    simState.index--;
    renderSimQuestion();
  }
});

$simNext.addEventListener('click', () => {
  if (simState && simState.index < simState.questions.length - 1) {
    simState.index++;
    renderSimQuestion();
  }
});

$simCheck.addEventListener('click', () => {
  if (!simState) return;
  const a = simState.answers[simState.index];
  if (a.checked) return;
  const q = simState.questions[simState.index];
  if (q.type === 'essay') {
    a.aiUsed = true;
    renderSimQuestion();
    openAiPrompt(buildAiPrompt(q, a.picked[0] || ''));
    return;
  }
  buildAttempt(q, a);
  a.checked = true;
  renderSimQuestion();
});

function simScoreText() {
  let got = 0;
  let max = 0;
  for (const a of simState.answers) {
    if (a.markMax > 0) {
      got += a.markObtained || 0;
      max += a.markMax;
    }
  }
  return `Puntos: ${Math.round(got * 100) / 100} / ${max}`;
}

function renderSimQuestion() {
  const q = simState.questions[simState.index];
  const a = simState.answers[simState.index];
  $simBody.innerHTML = '';
  $simScore.textContent = simScoreText();

  const pct = ((simState.index + 1) / simState.questions.length) * 100;
  $progressFill.style.width = pct + '%';
  $progressLabel.textContent = `${simState.index + 1} / ${simState.questions.length}`;

  const meta = document.createElement('div');
  meta.className = 'sim-meta';
  const pos = document.createElement('span');
  pos.textContent = `Pregunta ${simState.index + 1} de ${simState.questions.length}`;
  meta.appendChild(pos);
  if (q.sourceQuiz) {
    const badge = document.createElement('span');
    badge.className = 'sim-badge';
    badge.textContent = q.sourceQuiz;
    meta.appendChild(badge);
  }
  $simBody.appendChild(meta);

  const isEssay = q.type === 'essay';
  if (a.checked && !isEssay) {
    $simBody.appendChild(renderQuestion(buildAttempt(q, a)));
    $simCheck.disabled = true;
    $simCheck.textContent = '✓ Comprobada';
  } else {
    $simBody.appendChild(renderSimAnswer(q, a));
    $simCheck.disabled = false;
    $simCheck.textContent = isEssay ? 'Revisar con IA' : 'Comprobar';
  }
  $simPrev.disabled = simState.index === 0;
  $simNext.disabled = simState.index === simState.questions.length - 1;

  if (practiceComplete()) {
    $simBody.appendChild(simSummary());
  }
}

const simFlowRe = new RegExp('(' + IMG_T + '[^' + IMG_T + ']+' + IMG_T + ')|(<span class="ddwtos-answer">…</span>)', 'g');
const simImgPartRe = new RegExp('^' + IMG_T + '([^' + IMG_T + ']+)' + IMG_T + '$');
const simGapPartRe = /^<span class="ddwtos-answer">…<\/span>$/;

function makeGapSelect(q, a, gapIndex) {
  const opts = q.options || [];
  if (!opts.length) {
    const span = document.createElement('span');
    span.className = 'ddwtos-answer';
    span.textContent = '…';
    return span;
  }
  const sel = document.createElement('select');
  sel.className = 'sim-gap';
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = '— elegir —';
  sel.appendChild(blank);
  opts.forEach((o, oi) => {
    const optEl = document.createElement('option');
    optEl.value = String(oi);
    optEl.textContent = o.text;
    sel.appendChild(optEl);
  });
  sel.value = a.picked[gapIndex] != null ? String(a.picked[gapIndex]) : '';
  sel.addEventListener('change', () => {
    a.picked[gapIndex] = sel.value === '' ? null : parseInt(sel.value, 10);
  });
  return sel;
}

// Answer phase: interactive controls, one per question type.
function renderSimAnswer(q, a) {
  const div = document.createElement('div');

  const num = document.createElement('div');
  num.className = 'q-num bank';
  num.textContent = `P${q.questionNumber}`;
  div.appendChild(num);

  const type = document.createElement('div');
  type.className = 'q-type';
  type.textContent = q.type;
  div.appendChild(type);

  const text = document.createElement('div');
  text.className = 'q-text';
  const imgMap = new Map((q.images || []).map((i) => [i.url, i.localFile]));
  const isGapType = q.type === 'ddwtos' || q.type === 'gapselect';

  if (isGapType) {
    const parts = String(q.questionText || '').split(simFlowRe);
    let gapIndex = 0;
    for (const part of parts) {
      if (!part) continue;
      const imgM = part.match(simImgPartRe);
      const gapM = part.match(simGapPartRe);
      if (imgM) {
        const local = imgMap.get(imgM[1]);
        const imgEl = document.createElement('img');
        imgEl.className = 'q-img';
        imgEl.alt = 'question image';
        imgEl.loading = 'lazy';
        imgEl.src = res(local, imgM[1]);
        text.appendChild(imgEl);
      } else if (gapM) {
        text.appendChild(makeGapSelect(q, a, gapIndex));
        gapIndex++;
      } else {
        text.appendChild(document.createTextNode(part));
      }
    }
    const hint = document.createElement('div');
    hint.className = 'sim-hint';
    hint.textContent = 'Elige una opción para cada espacio.';
    div.appendChild(hint);
    const choices = document.createElement('div');
    choices.className = 'sim-choices';
    for (const o of q.options || []) {
      const chip = document.createElement('span');
      chip.className = 'sim-chip';
      chip.textContent = o.text;
      choices.appendChild(chip);
    }
    div.appendChild(choices);
  } else {
    const renderedInText = new Set();
    let processedText = String(q.questionText || '').replace(IMG_TOKEN_RE, (m, url) => {
      renderedInText.add(url);
      const local = imgMap.get(url);
      const src = res(local, url);
      return `<img class="q-img" alt="question image" loading="lazy" src="${src.replace(/"/g, '&quot;')}">`;
    });
    text.innerHTML = processedText;
    for (const img of q.images || []) {
      if (renderedInText.has(img.url)) continue;
      const imgEl = document.createElement('img');
      imgEl.className = 'q-img';
      imgEl.alt = 'question image';
      imgEl.loading = 'lazy';
      imgEl.src = res(img.localFile, img.url);
      text.appendChild(imgEl);
    }
  }
  div.appendChild(text);

  for (const aud of q.audios || []) {
    const el = document.createElement('audio');
    el.className = 'q-audio';
    el.controls = true;
    el.preload = 'none';
    el.src = res(aud.localFile, aud.url);
    div.appendChild(el);
  }

  if (isGapType) {
    // controls already rendered inside the text flow
  } else if (q.type === 'multichoice' || q.type === 'truefalse') {
    const correctCount = (q.options || []).filter((o) => o.markedCorrect).length;
    const single = q.type === 'truefalse' || correctCount <= 1;
    (q.options || []).forEach((o, oi) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'sim-opt' + (a.picked.includes(oi) ? ' picked' : '');
      const strong = document.createElement('strong');
      strong.textContent = o.letter;
      el.appendChild(strong);
      if (o.text) el.appendChild(document.createTextNode(' ' + o.text));
      for (const img of o.optionImages || []) {
        el.appendChild(document.createElement('br'));
        const imgEl = document.createElement('img');
        imgEl.className = 'opt-img';
        imgEl.alt = 'option image';
        imgEl.src = res(img.localFile, img.url);
        el.appendChild(imgEl);
      }
      el.addEventListener('click', () => {
        if (single) a.picked = a.picked[0] === oi ? [] : [oi];
        else a.picked = a.picked.includes(oi) ? a.picked.filter((x) => x !== oi) : [...a.picked, oi];
        const next = renderSimAnswer(q, a);
        const meta = $simBody.querySelector('.sim-meta');
        $simBody.innerHTML = '';
        if (meta) $simBody.appendChild(meta);
        $simBody.appendChild(next);
      });
      div.appendChild(el);
    });
  } else if (q.subQuestions && q.subQuestions.length) {
    q.subQuestions.forEach((sub, si) => {
      const subDiv = document.createElement('div');
      subDiv.className = 'sub-q';
      if (sub.questionText) {
        const stemEl = document.createElement('div');
        stemEl.className = 'sub-q-text';
        stemEl.textContent = sub.questionText;
        subDiv.appendChild(stemEl);
      }
      const sel = document.createElement('select');
      sel.className = 'sim-gap';
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = '— elegir —';
      sel.appendChild(blank);
      (sub.options || []).forEach((o, oi) => {
        const optEl = document.createElement('option');
        optEl.value = String(oi);
        optEl.textContent = o.text;
        sel.appendChild(optEl);
      });
      sel.value = a.picked[si] != null ? String(a.picked[si]) : '';
      sel.addEventListener('change', () => {
        a.picked[si] = sel.value === '' ? null : parseInt(sel.value, 10);
      });
      subDiv.appendChild(sel);
      div.appendChild(subDiv);
    });
  } else if (q.type === 'essay') {
    const ta = document.createElement('textarea');
    ta.className = 'sim-essay';
    ta.placeholder = 'Escribe tu respuesta aquí…';
    ta.value = a.picked[0] || '';
    ta.addEventListener('input', () => {
      a.picked[0] = ta.value;
    });
    div.appendChild(ta);
  } else {
    const hint = document.createElement('div');
    hint.className = 'sim-hint';
    hint.textContent = 'Pulsa «Comprobar» para ver la respuesta correcta y el feedback.';
    div.appendChild(hint);
  }
  return div;
}

// Turn a bank question + the user's picks into the attempt-like shape
// renderQuestion() expects, computing marks as a side effect.
function buildAttempt(q, a) {
  const copy = {
    ...q,
    options: (q.options || []).map((o) => ({ ...o, selected: false, markedIncorrect: false })),
    subQuestions: (q.subQuestions || []).map((s) => ({
      ...s,
      options: (s.options || []).map((o) => ({ ...o, selected: false, markedIncorrect: false })),
      selectedText: s.selectedText || '',
      isCorrect: false,
      isIncorrect: false,
    })),
  };
  const markMax = q.markMax > 0 ? q.markMax : 1;
  const isGapType = q.type === 'ddwtos' || q.type === 'gapselect';

  if (isGapType) {
    let gi = 0;
    copy.questionText = String(q.questionText || '').replace(
      /(<span class="ddwtos-answer">)[\s\S]*?(<\/span>)/g,
      (m, p1, p2) => {
        const val = a.picked ? a.picked[gi] : null;
        const choice = val != null && q.options && q.options[val] ? q.options[val].text : '…';
        gi++;
        return p1 + choice + p2;
      },
    );
    copy.isCorrect = false;
    copy.isWrong = false;
    copy.markObtained = 0;
    copy.markMax = 0;
    copy.options = [];
    a.markObtained = 0;
    a.markMax = 0;
    return copy;
  }

  if (q.type === 'multichoice' || q.type === 'truefalse') {
    const correctIdx = new Set(
      (q.options || []).map((o, i) => (o.markedCorrect ? i : -1)).filter((i) => i >= 0),
    );
    const picked = new Set(a.picked || []);
    copy.options.forEach((o, i) => {
      o.selected = picked.has(i);
      o.markedIncorrect = picked.has(i) && !o.markedCorrect;
    });
    if (correctIdx.size === 0) {
      copy.options.forEach((o, i) => {
        o.selected = picked.has(i);
        o.markedIncorrect = false;
      });
      copy.isCorrect = false;
      copy.isWrong = false;
      copy.markObtained = 0;
      copy.markMax = 0;
      a.markObtained = 0;
      a.markMax = 0;
    } else {
      let matched = 0;
      for (const i of picked) if (correctIdx.has(i)) matched++;
      const exact = picked.size === correctIdx.size && [...correctIdx].every((i) => picked.has(i));
      const pct = exact ? 1 : matched / correctIdx.size;
      copy.isCorrect = exact;
      copy.isWrong = !exact && matched === 0;
      copy.markObtained = Math.round(pct * markMax * 100) / 100;
      copy.markMax = markMax;
      a.markObtained = copy.markObtained;
      a.markMax = markMax;
    }
    return copy;
  }

  if (q.subQuestions && q.subQuestions.length) {
    let scored = 0;
    let total = 0;
    copy.subQuestions = copy.subQuestions.map((s, si) => {
      const corrIdx = (s.options || []).findIndex((o) => o.markedCorrect);
      const pickedVal = a.picked ? a.picked[si] : null;
      const userOpt = pickedVal != null && s.options[pickedVal] ? s.options[pickedVal] : null;
      s.selectedText = userOpt ? userOpt.text : '';
      if (corrIdx >= 0) {
        total++;
        if (userOpt && corrIdx === pickedVal) {
          s.isCorrect = true;
          s.isIncorrect = false;
          scored++;
        } else {
          s.isCorrect = false;
          s.isIncorrect = true;
        }
      } else {
        s.isCorrect = false;
        s.isIncorrect = false;
      }
      s.options.forEach((o, oi) => {
        o.selected = oi === pickedVal;
        o.markedIncorrect = oi === pickedVal && !o.markedCorrect;
      });
      return s;
    });
    if (total === 0) {
      copy.isCorrect = false;
      copy.isWrong = false;
      copy.markObtained = 0;
      copy.markMax = 0;
      a.markObtained = 0;
      a.markMax = 0;
    } else {
      const pct = scored / total;
      copy.isCorrect = scored === total;
      copy.isWrong = scored === 0;
      copy.markObtained = Math.round(pct * markMax * 100) / 100;
      copy.markMax = markMax;
      a.markObtained = copy.markObtained;
      a.markMax = markMax;
    }
    return copy;
  }

  if (q.type === 'essay') {
    copy.essayResponse = (a.picked && a.picked[0]) || '';
  }
  copy.isCorrect = false;
  copy.isWrong = false;
  copy.markObtained = 0;
  copy.markMax = 0;
  a.markObtained = 0;
  a.markMax = 0;
  return copy;
}

function simSummary() {
  let got = 0;
  let max = 0;
  let correct = 0;
  let partial = 0;
  let wrong = 0;
  let unscored = 0;
  for (const a of simState.answers) {
    if (a.markMax > 0) {
      got += a.markObtained || 0;
      max += a.markMax;
      if (a.markObtained >= a.markMax) correct++;
      else if (a.markObtained > 0) partial++;
      else wrong++;
    } else {
      unscored++;
    }
  }
  const wrap = document.createElement('div');
  wrap.className = 'sim-summary';
  const title = document.createElement('div');
  title.className = 'sim-summary-title';
  title.textContent = 'Resumen de la práctica';
  wrap.appendChild(title);
  const stats = document.createElement('div');
  stats.className = 'sim-summary-stats';
  stats.textContent =
    `✓ ${correct} correctas · ` +
    `≈ ${partial} parciales · ` +
    `✗ ${wrong} incorrectas` +
    (unscored ? ` · ${unscored} sin calificar (texto/reordenar)` : '');
  wrap.appendChild(stats);
  const score = document.createElement('div');
  score.className = 'sim-summary-score';
  score.textContent = `Puntuación: ${Math.round(got * 100) / 100} / ${max}`;
  wrap.appendChild(score);
  const actions = document.createElement('div');
  actions.className = 'sim-summary-actions';

  const restart = document.createElement('button');
  restart.type = 'button';
  restart.className = 'sim-btn primary';
  restart.textContent = '↻ Repetir estas preguntas';
  restart.addEventListener('click', () => {
    simState.answers = simState.questions.map(() => ({ picked: [], checked: false, markObtained: 0, markMax: 0 }));
    simState.index = 0;
    renderSimQuestion();
    syncTimer();
    window.scrollTo({ top: 0, behavior: 'auto' });
  });
  actions.appendChild(restart);

  if (simState.mode === '10') {
    const again = document.createElement('button');
    again.type = 'button';
    again.className = 'sim-btn';
    again.textContent = 'Otra ronda de ' + simState.questions.length;
    again.addEventListener('click', () => {
      const skill = SKILLS.find((s) => s.key === simState.skill) || SKILLS[0];
      startPractice(poolFor(simState.skill, '10'), {
        label: skill.key === 'all' ? 'Todas las áreas' : skill.label,
        mode: '10',
        skill: simState.skill,
      });
    });
    actions.appendChild(again);
  }

  const toMenu = document.createElement('button');
  toMenu.type = 'button';
  toMenu.className = 'sim-btn';
  toMenu.textContent = 'Volver al menú';
  toMenu.addEventListener('click', () => showScreen('menu'));
  actions.appendChild(toMenu);

  wrap.appendChild(actions);
  return wrap;
}

document.getElementById('bank-summary').textContent =
  `${DATA.questions.length} preguntas únicas · ${DATA.quizzes.length} quizzes · Grammar, Listening, Reading y Writing`;
buildMenu();
updateStart();
showScreen('menu');

</script>
